services:
  - type: web
    name: tudduke-okufa-web
    env: node
    plan: free 
    buildCommand: cd backend && npm install && npm rebuild sqlite3 --build-from-source
    startCommand: cd backend && npm run seed && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20.18.0"
